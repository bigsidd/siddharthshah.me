name: site-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check_site.py
      - name: projects page matches projects.json
        run: |
          python3 scripts/build-projects.py
          git diff --exit-code -- public/projects/ || {
            echo "::error::public/projects/index.html doesn't match projects.json. Run python3 scripts/build-projects.py and commit the result."
            exit 1
          }
      - name: case studies match their page.json
        run: |
          python3 scripts/build-case-studies.py
          git diff --exit-code -- public/projects/ public/sitemap.xml || {
            echo "::error::A case-study page or the sitemap doesn't match case-studies/. Run python3 scripts/build-case-studies.py and commit the result."
            exit 1
          }
