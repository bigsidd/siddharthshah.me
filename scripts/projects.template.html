:root{--bg:#FFFFFF;--ink:#121316;--muted:#5A5D62;--accent:#8A5A00;--hair:rgba(18,19,22,.16);color-scheme:light;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
:root[data-theme="dark"]{--bg:#111214;--ink:#EDEDEB;--muted:#A3A5A8;--accent:#E5A24B;--hair:rgba(237,237,235,.18);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main{max-width:760px;margin:0 auto;padding:40px 24px 64px}
.back,.meta{font-family:var(--mono);font-weight:500;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.back{font-size:13px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.back:hover{color:var(--ink)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,6vw,56px);line-height:1;letter-spacing:-.03em;margin:8px 0 12px}
.sub{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 28px;max-width:52ch}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;padding:28px 0 24px;border-bottom:1px solid var(--hair)}
.meta{margin:0;padding-top:9px;line-height:1.7}
.meta span{display:block}
h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:clamp(24px,3.6vw,30px);line-height:1.1;margin:0 0 10px}
.story{margin:0;font-size:17px;line-height:1.6;max-width:60ch}
.go{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-weight:600;font-size:16px;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.ar{color:var(--accent);font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){
  main{padding:16px 18px 48px}
  li{grid-template-columns:1fr;gap:4px;padding:22px 0 18px}
  .meta{padding:0}
  .meta span{display:inline}
  .meta span+span::before{content:" · "}
  .story{font-size:16.5px}
}
