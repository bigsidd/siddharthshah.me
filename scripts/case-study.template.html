<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · Siddharth Shah</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="https://siddharthshah.me/projects/{{SLUG}}/">
<meta property="og:title" content="{{TITLE}} · Siddharth Shah">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:url" content="https://siddharthshah.me/projects/{{SLUG}}/">
<meta property="og:image" content="https://siddharthshah.me/brand/og.png?v=6">

<script>(function(){var r=document.documentElement,m='auto';try{m=localStorage.getItem('mode')||'auto'}catch(e){}var h=new Date().getHours();r.dataset.theme=(m==='dark'||(m!=='light'&&(h<7||h>=19)))?'dark':'light'})()</script>
<style>
/* Generated by scripts/build-case-studies.py from case-studies/{{SLUG}}/. Edit those, not this file. */
:root{--bg:#FFFFFF;--ink:#121316;--muted:#5A5D62;--accent:#8A5A00;--hair:rgba(18,19,22,.16);--slot:#F4F4F2;color-scheme:light;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
:root[data-theme="dark"]{--bg:#111214;--ink:#EDEDEB;--muted:#A3A5A8;--accent:#E5A24B;--hair:rgba(237,237,235,.18);--slot:#1B1C1F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main{max-width:1080px;margin:0 auto;padding:16px 32px 32px}
.back,.meta,dt{font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.back{font-size:13px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.back:hover{color:var(--ink)}
.meta{font-size:12.5px;margin:4px 0 0}
.meta span+span::before{content:" · "}
.meta a{color:var(--ink);text-decoration:none;display:inline-block;padding:12px 0;margin:-12px 0}
.meta a:hover{text-decoration:underline}
.ar{color:var(--accent);font-family:var(--mono)}

/* the head: everything a 60-second reader needs, inside the first screen */
.head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start;margin-top:8px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,3.6vw,44px);line-height:1.04;letter-spacing:-.03em;margin:10px 0 14px;text-wrap:balance}
.sum{font-size:18px;line-height:1.5;margin:0 0 18px;text-wrap:pretty}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px;padding:12px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.facts div{min-width:0}
dt{font-size:11px;margin:0 0 3px}
dd{margin:0;font-size:14.5px;line-height:1.35}
.out{margin:0;font-size:16px;line-height:1.5;padding-left:14px;border-left:3px solid var(--accent);text-wrap:pretty}
.out b{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}

/* fixed-ratio image slots: a better image drops in without moving the layout */
.slot{display:block;aspect-ratio:var(--r);background:var(--slot);border:1px solid var(--hair);overflow:hidden}
.slot img{display:block;width:100%;height:100%;object-fit:contain;object-position:top center;background:#FFFFFF}
:root[data-theme="dark"] .slot img{filter:brightness(.92)}
figure{margin:0}
figcaption{font-size:13px;line-height:1.45;color:var(--muted);margin-top:8px}

/* the story and the calls */
.body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start;margin:44px 0 0}
.story p{font-size:17.5px;line-height:1.65;margin:0 0 16px;text-wrap:pretty}
h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:24px;line-height:1.1;margin:0 0 10px}
.calls{margin:0;border-top:1px solid var(--hair)}
.calls div{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,5fr);gap:16px;padding:9px 0;border-bottom:1px solid var(--hair)}
.calls dt{font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);margin:0;line-height:1.4}
.calls dd{font-size:15px;line-height:1.45;color:var(--muted)}

/* secondary images: a pair side by side, or a rail that scrolls sideways */
.gallery{margin:36px 0 0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.rail figure{scroll-snap-align:start}
.links{display:flex;flex-wrap:wrap;gap:0 24px;margin:24px 0 0}
.links a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:16px;text-decoration:underline}
.foot{margin:32px 0 0;border-top:1px solid var(--hair)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  main{padding:8px 18px 48px}
  .head{grid-template-columns:1fr;gap:16px}
  h1{font-size:clamp(26px,7.4vw,34px);margin:6px 0 10px}
  .sum{font-size:16px;margin-bottom:12px}
  .facts{gap:8px;margin-bottom:12px;padding:10px 0}
  dd{font-size:13px}
  .out{font-size:15px}
  .body{grid-template-columns:1fr;gap:16px;margin-top:32px}
  .story p{font-size:16.5px}
  .calls div{grid-template-columns:1fr;gap:2px;padding:10px 0}
  .pair{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:88%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
  .pair figure{scroll-snap-align:start}
  .rail{grid-auto-columns:82%;gap:12px}
  figcaption{font-size:12.5px}
}
</style>
</head>
<body>

<div>

</main>
</body>
</html>
